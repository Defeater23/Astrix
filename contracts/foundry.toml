# Foundry project for the on-chain layer (Solidity).
# Module 05 (completion) adds SentinelPolicy plus its Foundry tests. The tests have NOT been run by
# the author; see ../MODULE_HANDOVER.md. Kernel/ERC-4337 account integration is not part of this
# package yet.
[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
out = "out"
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "kernel/=lib/kernel/src/",
  "solady/=lib/solady/src/",
  "ExcessivelySafeCall/=lib/ExcessivelySafeCall/src/",
  "account-abstraction/=lib/account-abstraction/contracts/"
]

[fuzz]
runs = 256
